name: Update the cask

# Casks/twindesk.rb follows TwinDesk's latest release: its version and the two disk images' checksums.
# Every six hours, or run it by hand after publishing a release.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Point the cask at the latest release
        id: bump
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(gh release view -R InukaAsith/TwinDesk --json tagName -q .tagName)
          VER="${TAG#v}"
          CUR=$(sed -n 's/^  version "\(.*\)"$/\1/p' Casks/twindesk.rb)
          echo "latest $VER, cask $CUR"
          [ "$VER" = "$CUR" ] && exit 0
          gh release download "$TAG" -R InukaAsith/TwinDesk -p "TwinDesk-$VER-arm64.dmg" -p "TwinDesk-$VER-x64_Intel.dmg"
          ARM=$(shasum -a 256 "TwinDesk-$VER-arm64.dmg" | cut -d' ' -f1)
          INTEL=$(shasum -a 256 "TwinDesk-$VER-x64_Intel.dmg" | cut -d' ' -f1)
          rm TwinDesk-*.dmg
          sed -i '' -e "s/^  version \".*\"$/  version \"$VER\"/" \
                    -e "s/^  sha256 arm:   \".*\",$/  sha256 arm:   \"$ARM\",/" \
                    -e "s/^         intel: \".*\"$/         intel: \"$INTEL\"/" Casks/twindesk.rb
          git diff
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: Check it
        if: steps.bump.outputs.version
        run: |
          brew tap-new --no-git local/check
          mkdir -p "$(brew --repository local/check)/Casks"
          cp Casks/twindesk.rb "$(brew --repository local/check)/Casks/"
          brew style local/check/twindesk
          brew audit --cask --online local/check/twindesk
          brew fetch --cask local/check/twindesk --arch=arm
          brew fetch --cask local/check/twindesk --arch=intel

      - name: Commit
        if: steps.bump.outputs.version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "twindesk ${{ steps.bump.outputs.version }}"
          git push
